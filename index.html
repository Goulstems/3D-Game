<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <h1>A Cooking Game</h1>

        <!-- Span makes the score and the number on the same line -->
        <p>
            Score:
            <span id="score"></span> 
        </p>
    </div>

    <div id="game"></div>
    
    <!-- Lets Three.js addons (like OBJLoader) find the "three" module -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
        }
    }
    </script>

    <!-- Type module means that we have to go out of our browser and into the web -->
    <script type="module" src="game.js"></script>
</body>
</html>
